[package]
name = "pe-loader-evidence-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[dev-dependencies]
reqwest = { version = "0.12", default-feames = false, features = ["rustls-tls", "json"] }

[[bin]]
name = "pe-loader-evidence-bench"
path = "src/main.rs"
