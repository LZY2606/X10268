[package]
name = "pe-loader-lens"
version = "0.1.0"
edition = "2021"
description = "PE loader lens: section mapping, base relocation and import binding evidence bench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ureq = "2"
