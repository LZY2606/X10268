[package]
name = "pe-loader-workbench"
version = "0.1.0"
edition = "2021"
description = "Local PE / loader-semantics / relocation review workbench (offline)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3"

[lib]
name = "peload"
path = "src/lib.rs"

[[bin]]
name = "pe-loader-workbench"
path = "src/main.rs"
