[package]
name = "pe_loader_workbench"
version = "0.1.0"
edition = "2021"
description = "Local PE loader-semantics workbench: section mapping, base relocations, import binding evidence bench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

[[bin]]
name = "pe_loader_workbench"
path = "src/main.rs"
