[package]
name = "pe_loader_workbench"
version = "0.1.0"
edition = "2024"

[lib]
name = "pelb"
path = "src/lib.rs"

[[bin]]
name = "pe_loader_workbench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
