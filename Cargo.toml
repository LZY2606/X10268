[package]
name = "pe-loader-bench"
version = "0.1.0"
edition = "2021"
description = "Local PE loader semantics / relocation / import evidence workbench"

[lib]
name = "pe_loader_bench"
path = "src/lib.rs"

[[bin]]
name = "pe-loader-bench"
path = "src/main.rs"

[[bin]]
name = "gen-case"
path = "src/bin/gen_case.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
