[package]
name = "pe-loader-workbench"
version = "0.1.0"
edition = "2021"
description = "Local PE loading-semantics / relocation review workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
