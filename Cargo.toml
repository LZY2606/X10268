[package]
name = "pe-loader-mirror"
version = "0.1.0"
edition = "2021"
description = "PE loader-semantics workbench: section mapping, base relocation and import binding evidence desk"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
