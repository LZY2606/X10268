[package]
name = "pe-loader-evidence-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
chromiumoxide = { version = "0.7.0", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "pe-loader-evidence-bench"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
